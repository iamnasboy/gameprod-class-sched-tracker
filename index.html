<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Class Games Schedule Tracker</title>
    <link rel="stylesheet" href="styles.css?v=2026-09-07-week-nav" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Class Games Schedule</p>
          <h1>Upcoming Classes & Games</h1>
        </div>
        <div class="summary" aria-label="Filtered summary">
          <div>
            <span id="summaryLessons">0</span>
            <small>visible lessons</small>
          </div>
          <div>
            <span id="summaryMissing">0</span>
            <small>missing games</small>
          </div>
          <div>
            <span id="summaryUrgent">0</span>
            <small>urgent</small>
          </div>
        </div>
      </header>

      <section class="controls" aria-label="Filters">
        <div class="segmented" role="tablist" aria-label="Subject">
          <button class="active" data-subject="Math" type="button">Math</button>
          <button data-subject="Science" type="button">Science</button>
        </div>
        <div class="weekNav" aria-label="Timeline window">
          <button id="todayWeek" class="todayButton" type="button">Today</button>
          <button id="prevWeek" class="navArrow" type="button" aria-label="Previous 7 days" title="Previous 7 days">‹</button>
          <div id="weekWindow" class="weekWindow">7-day view from today</div>
          <button id="nextWeek" class="navArrow" type="button" aria-label="Next 7 days" title="Next 7 days">›</button>
        </div>
        <label class="toggle">
          <input id="missingOnly" type="checkbox" />
          Missing only
        </label>
      </section>

      <section class="legend" aria-label="Legend">
        <span><i class="done"></i>Ready</span>
        <span><i class="pending"></i>In production / pending</span>
        <span><i class="missing"></i>No game specified</span>
        <span><i class="today"></i>Today marker</span>
      </section>

      <section class="chartPanel" aria-label="Weekly game schedule">
        <div id="gantt" class="gantt"></div>
      </section>

      <section class="tablePanel" aria-label="Visible lesson details">
        <div class="tableHeader">
          <h2>Visible Games</h2>
          <p id="tableNote"></p>
        </div>
        <div class="tableWrap">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Level</th>
                <th>Game</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="lessonRows"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="data.js?v=2026-09-07-week-nav"></script>
    <script src="app.js?v=2026-09-07-week-nav"></script>
  </body>
</html>
